name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned so that a new ruff release cannot turn CI red on its own.
        run: python -m pip install "ruff==0.17.1"
      - name: Ruff check
        run: ruff check .

  wheel:
    name: installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl pandas
      - name: Run the quickstart against the installed wheel
        run: |
          export NUMBA_CACHE_DIR="$RUNNER_TEMP/numba-cache"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import barrierscan, pathlib; assert 'site-packages' in barrierscan.__file__; assert (pathlib.Path(barrierscan.__file__).parent / 'py.typed').exists()"
